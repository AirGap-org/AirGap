services:
  db:
    image: postgres:18
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      PGUSER: ${DB_USER}
    volumes:
      - "postgres_data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    networks:
      - airgap_db_net
      - adminer_db_net
    security_opt:
      - no-new-privileges:true

  adminer:
    image: adminer:5
    restart: always
    profiles: [adminer]
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - adminer_db_net
    security_opt:
      - no-new-privileges:true

  airgap:
    # En production, toujours passer un tag exact :
    #   AIRGAP_IMAGE=registry.gitlab.com/akahira/airgap:v1.2.3
    image: ${AIRGAP_IMAGE:-registry.gitlab.com/akahira/airgap:latest}
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file: ".env"
    environment:
      # L'IA reste sur le réseau interne : aucun libellé ne transite par Internet.
      AIRGAP_AI_PREDICT_URL: "http://airgap-ai:8000/predire"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - airgap_db_net
      - airgap_ai_net

  airgap-ai:
    # En production, toujours passer un tag exact :
    #   AIRGAP_AI_IMAGE=registry.gitlab.com/akahira/airgap-ai:v1.2.3
    image: ${AIRGAP_AI_IMAGE:-registry.gitlab.com/akahira/airgap-ai:latest}
    restart: always
    # Pas de port public : le service n'est joignable que par airgap_ai_net.
    environment:
      ENVIRONMENT: PRODUCTION
      ALLOWED_HOSTS: 'airgap-ai,airgap-ai.aldwin-weber.fr'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 8000), 2); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - airgap_ai_net

volumes:
  postgres_data:

networks:
  airgap_db_net:
  airgap_ai_net:
    internal: true
  adminer_db_net:
