name: CI

on:
  pull_request:
  push:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Les avis restants (Nuxt/nitropack, 0 high/critical) n'ont pas de
      # correctif amont : on bloque uniquement sur high/critical.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: airgap
          POSTGRES_PASSWORD: airgap123
          POSTGRES_DB: airgap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airgap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NUXT_DATABASE_URL: postgresql://airgap:airgap123@localhost:5432/airgap_test
      NUXT_APP_SECRET: fedcba9876543210fedcba9876543210
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx drizzle-kit migrate

      - name: Run tests
        run: npm test
